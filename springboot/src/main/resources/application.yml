server:
  port: 9096

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# --- 注意：下面的 spring 必须顶格写，不能在 server 里面 ---
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    url: ${DB_URL:jdbc:mysql://localhost:3306/system2?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true}
  flyway:
    enabled: false

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

fileBaseUrl: http://localhost:${server.port}

python:
  agent:
    url: ${PYTHON_AGENT_URL:http://127.0.0.1:8081/api/v1/algo/analyze}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24小时（毫秒）

# Python AI 服务回调共享密钥
ai:
  callback:
    secret: ${AI_CALLBACK_SECRET}

# CORS 配置（生产环境应设置为前端域名，多个用逗号分隔）
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174}
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
  max-age: ${CORS_MAX_AGE:3600}

# 全局 API 限流配置
rate-limit:
  global: ${RATE_LIMIT_GLOBAL:120}        # 每 IP 每分钟最大请求数
  window-seconds: ${RATE_LIMIT_WINDOW:60} # 限流窗口（秒）

# Actuator 健康检查端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never