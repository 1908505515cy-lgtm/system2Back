# --- 注意：下面的 spring 必须顶格写，不能在 server 里面 ---
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root131412
    url: jdbc:mysql://localhost:3306/system2?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

fileBaseUrl: http://localhost:${server.port}

python:
  agent:
    url: http://127.0.0.1:8081/api/v1/algo/analyze

jwt:
  secret: System2SecretKeyForJwtTokenGeneration2026VeryLongAndSecure
  expiration: 86400000  # 24小时（毫秒）